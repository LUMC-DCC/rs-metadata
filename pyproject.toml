[project]
name = "rs-metadata"
version = "1.0.0"
description = "Validate research software metadata against the LUMC CodeMeta profile, and keep codemeta.json consistent with CITATION.cff and other metadata."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "codemeta",
    "citation-file-format",
    "research-software",
    "metadata",
    "fair",
    "validation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
]
authors = [{ name = "Mariia Steeghs-Turchina" }]

dependencies = [
    "jsonschema>=4.21,<5",
    "nameparser>=1.1",
    "packaging>=23.0",
    "pyyaml>=6.0,<7",
]

[project.urls]
Homepage = "https://lumc-dcc.github.io/rs-metadata/"
Repository = "https://github.com/LUMC-DCC/rs-metadata"
Issues = "https://github.com/LUMC-DCC/rs-metadata/issues"
Changelog = "https://github.com/LUMC-DCC/rs-metadata/releases"
Documentation = "https://lumc-dcc.github.io/rs-metadata/"

[project.scripts]
rs-metadata = "rs_metadata.cli:main"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "rs_metadata", from = "src" }]
# The vendored vocabularies, the generated profile schema and the crosswalk
# mappings are read at runtime, so they must travel with the wheel. The profile
# definition the schema is generated from goes in the sdist only: it is build
# input, not something the installed package reads.
include = [
    { path = "profile/*.yaml", format = "sdist" },
    { path = "src/rs_metadata/data/*.json", format = ["sdist", "wheel"] },
    { path = "src/rs_metadata/data/*.jsonld", format = ["sdist", "wheel"] },
    { path = "src/rs_metadata/schema/*.json", format = ["sdist", "wheel"] },
    { path = "src/rs_metadata/mappings/*.yaml", format = ["sdist", "wheel"] },
]

[tool.poetry.group.docs.dependencies]
sphinx = ">=8.0"
myst-parser = ">=4.0"
sphinx-book-theme = ">=1.1"
sphinx-copybutton = ">=0.5"
sphinxcontrib-mermaid = ">=1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.6"
mypy = ">=1.11"
types-pyyaml = ">=6.0"
types-jsonschema = ">=4.21"

[tool.pytest.ini_options]
minversion = "8.0"
# `src` is collected so that every docstring example runs as a test. The
# examples are the documentation for the validation rules, and an example that
# is not executed is an example that quietly stops being true.
testpaths = ["tests", "src"]
# `--doctest-continue-on-failure` because doctest otherwise abandons a
# docstring at its first failing example, so one platform-specific line hides
# every later one in the same docstring. That is how a Windows-only failure
# survived a round of fixes: two of three were corrected, the third stayed
# invisible until the first two passed.
addopts = """
  -ra --strict-markers --strict-config
  --doctest-modules --doctest-continue-on-failure
"""
# ELLIPSIS lets a docstring elide the middle of a long message rather than
# carrying a line the formatter cannot wrap.
doctest_optionflags = ["ELLIPSIS"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["rs_metadata"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 88
extend-exclude = ["docs/_build"]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
include = ["src", "tests", "scripts", "docs/conf.py"]
exclude = ["**/__pycache__", "docs/_build", "docs/_extra", ".venv"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
exclude = ["docs/conf.py"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "conf"
ignore_errors = true

[[tool.mypy.overrides]]
module = "nameparser"
ignore_missing_imports = true
