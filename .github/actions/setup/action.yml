name: Set up the project
description: >-
  Install Python, Poetry and the project's dependencies. Used by this
  repository's own workflows. The published action is action.yml at the root;
  this one is internal.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.12"
  groups:
    description: >-
      Extra Poetry dependency groups to install, as passed to --with. Leave
      empty for the default groups.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Poetry
      shell: bash
      run: pipx install poetry

    - name: Install dependencies
      shell: bash
      run: |
        if [ -n "${{ inputs.groups }}" ]; then
          poetry install --no-interaction --with "${{ inputs.groups }}"
        else
          poetry install --no-interaction
        fi
