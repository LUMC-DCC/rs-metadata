name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: Where to upload.
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      # The tag is what people will cite; pyproject.toml is what gets
      # installed. If they disagree, the wrong version is burned permanently.
      - name: Tag matches the package version
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          declared="$(poetry version --short)"
          echo "tag=${TAG}  pyproject=${declared}"
          if [ "${TAG#v}" != "${declared}" ]; then
            echo "::error::Release tag ${TAG} does not match version ${declared}." >&2
            exit 1
          fi

      - name: Build
        run: poetry build

      - name: Check the artifacts
        run: |
          pipx install twine
          twine check --strict dist/*

      # A wheel that imports in the repository but not outside it is the
      # classic packaging failure: data files declared but never included.
      - name: Install the wheel somewhere else and run it
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/smoke"
          "${RUNNER_TEMP}/smoke/bin/pip" install --quiet dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/smoke/bin/rs-metadata" --version
          "${RUNNER_TEMP}/smoke/bin/rs-metadata" explain profile.required-field
          "${RUNNER_TEMP}/smoke/bin/rs-metadata" validate \
            "${GITHUB_WORKSPACE}/examples/complete"

      - uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: dist/

  testpypi:
    name: TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/rs-metadata/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: PyPI
    needs: build
    if: github.event_name == 'release' || inputs.repository == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rs-metadata/
    # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so
    # there is no API token to store, leak or rotate. Configure it once at
    # https://pypi.org/manage/project/rs-metadata/settings/publishing/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
