name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

# The published site is a single deployment target. Cancelling a superseded run
# rather than queueing it keeps the live site matching the newest commit.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          groups: docs

      # -W turns warnings into errors, so a broken cross-reference or a stale
      # autodoc target fails here rather than publishing a page with a dead
      # link in it.
      - name: Sphinx
        run: poetry run sphinx-build -b html -W --keep-going docs docs/_build/html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
